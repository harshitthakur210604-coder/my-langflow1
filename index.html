<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bharat AI Guru - Admission Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f8fafc; color: #1e293b; }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- 1. START SCREEN -->
    <div id="setup-screen" class="glass max-w-md w-full p-8 rounded-3xl shadow-2xl border border-white fade-in">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-extrabold text-blue-600 mb-2">Bharat AI Guru</h1>
            <p class="text-gray-500">Student Admission Entrance</p>
        </div>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-semibold mb-1">Student Name</label>
                <input type="text" id="student-name" class="w-full border-2 border-gray-100 p-3 rounded-xl focus:border-blue-500 outline-none transition" placeholder="Enter Full Name">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">Target Class</label>
                <select id="student-class" class="w-full border-2 border-gray-100 p-3 rounded-xl focus:border-blue-500 outline-none transition">
                    <option value="1st">Class 1st</option>
                    <option value="2nd">Class 2nd</option>
                    <option value="3rd">Class 3rd</option>
                    <option value="4th">Class 4th</option>
                    <option value="5th">Class 5th</option>
                    <option value="6th">Class 6th</option>
                    <option value="7th">Class 7th</option>
                    <option value="8th">Class 8th</option>
                    <option value="9th">Class 9th</option>
                </select>
            </div>
            <button onclick="startTest()" id="start-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl shadow-lg transition transform hover:scale-[1.02] active:scale-95">
                Start Admission Test
            </button>
        </div>
    </div>

    <!-- 2. QUIZ SCREEN -->
    <div id="quiz-screen" class="hidden glass max-w-2xl w-full p-8 rounded-3xl shadow-2xl border border-white fade-in">
        <div class="flex justify-between items-center mb-8">
            <div>
                <span id="subject-tag" class="bg-blue-100 text-blue-700 px-4 py-1 rounded-full text-xs font-bold uppercase tracking-wider">Loading...</span>
            </div>
            <div class="text-right">
                <p id="progress-text" class="text-xs font-bold text-gray-400">Question 0/20</p>
                <div class="w-32 h-1.5 bg-gray-100 rounded-full mt-1 overflow-hidden">
                    <div id="progress-bar" class="h-full bg-blue-500 transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <h2 id="question-text" class="text-2xl font-bold mb-8 leading-tight">Preparing your test questions...</h2>
        
        <div id="options-container" class="grid grid-cols-1 gap-4">
            <!-- Options injected here -->
        </div>
    </div>

    <!-- 3. RESULT & ANALYSIS SCREEN -->
    <div id="result-screen" class="hidden glass max-w-2xl w-full p-8 rounded-3xl shadow-2xl border border-white fade-in text-center">
        <div class="mb-8">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-green-100 rounded-full mb-4">
                <svg class="w-10 h-10 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <h2 class="text-3xl font-bold text-gray-800">Test Submitted!</h2>
            <p id="score-display" class="text-5xl font-black text-blue-600 mt-4">0/20</p>
            <p class="text-gray-400 font-medium uppercase tracking-widest mt-2">Final Score</p>
        </div>

        <div class="text-left bg-blue-50/50 rounded-2xl p-6 border border-blue-100">
            <div class="flex items-center mb-4">
                <span class="text-2xl mr-2">🧘</span>
                <h3 class="font-bold text-blue-800 uppercase tracking-tight">Guru's AI Analytics Report</h3>
            </div>
            <div id="ai-report-content" class="text-gray-700 leading-relaxed text-sm italic">
                Analyzing your performance and generating personalized advice...
            </div>
        </div>
        
        <button onclick="window.location.reload()" class="mt-8 text-blue-600 font-bold hover:underline">Take Another Test</button>
    </div>

    <script>
        // CONFIGURATION: Replace with your HarxitFlow URL
        const HARXITFLOW_API_URL = "http://localhost:7860/api/v1/run/YOUR_FLOW_ID"; 
        
        let questions = [];
        let currentIdx = 0;
        let score = 0;
        let studentResponses = [];
        let studentName = "";
        let studentClass = "";

        async function startTest() {
            studentName = document.getElementById('student-name').value;
            studentClass = document.getElementById('student-class').value;

            if(!studentName) return alert("Please enter student name");

            const btn = document.getElementById('start-btn');
            btn.disabled = true;
            btn.innerHTML = `<span class="inline-block animate-spin mr-2">⏳</span> Generating Test...`;

            try {
                const response = await fetch(HARXITFLOW_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        input_value: JSON.stringify({
                            task: "GENERATE",
                            student_name: studentName,
                            class: studentClass
                        })
                    })
                });
                
                const result = await response.json();
                const outputText = result.outputs[0].outputs[0].results.message.text;
                questions = JSON.parse(outputText);

                document.getElementById('setup-screen').classList.add('hidden');
                document.getElementById('quiz-screen').classList.remove('hidden');
                showQuestion();
            } catch (err) {
                alert("Could not connect to HarxitFlow. Please ensure your local server is running.");
                btn.disabled = false;
                btn.innerText = "Start Admission Test";
            }
        }

        function showQuestion() {
            const q = questions[currentIdx];
            const progress = ((currentIdx + 1) / questions.length) * 100;
            
            document.getElementById('subject-tag').innerText = q.subject;
            document.getElementById('progress-text').innerText = `Question ${currentIdx + 1}/${questions.length}`;
            document.getElementById('progress-bar').style.width = `${progress}%`;
            document.getElementById('question-text').innerText = q.question;
            
            const container = document.getElementById('options-container');
            container.innerHTML = "";

            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "text-left p-5 border-2 border-gray-100 rounded-2xl hover:border-blue-500 hover:bg-blue-50 transition-all font-medium group flex justify-between items-center";
                btn.innerHTML = `
                    <span>${opt}</span>
                    <span class="opacity-0 group-hover:opacity-100 transition text-blue-500 text-xl">→</span>
                `;
                btn.onclick = () => handleAnswer(opt);
                container.appendChild(btn);
            });
        }

        function handleAnswer(selected) {
            const currentQ = questions[currentIdx];
            const isCorrect = selected === currentQ.correct;
            
            if(isCorrect) score++;

            studentResponses.push({
                question: currentQ.question,
                subject: currentQ.subject,
                userAnswer: selected,
                correctAnswer: currentQ.correct,
                status: isCorrect ? "Correct" : "Wrong"
            });

            currentIdx++;
            if(currentIdx < questions.length) {
                showQuestion();
            } else {
                finishTest();
            }
        }

        async function finishTest() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('score-display').innerText = `${score}/${questions.length}`;

            try {
                const response = await fetch(HARXITFLOW_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        input_value: JSON.stringify({
                            task: "ANALYZE",
                            student_info: `${studentName} (Class: ${studentClass})`,
                            score_summary: `${score} out of ${questions.length} correct.`,
                            test_data: JSON.stringify(studentResponses)
                        })
                    })
                });
                
                const result = await response.json();
                document.getElementById('ai-report-content').innerText = result.outputs[0].outputs[0].results.message.text;
                document.getElementById('ai-report-content').classList.remove('italic');
            } catch (err) {
                document.getElementById('ai-report-content').innerText = "Test submitted successfully, but Guru's AI report is currently unavailable.";
            }
        }
    </script>
</body>
</html>
